name: ci

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: |
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee fmt.log
      - name: annotate
        if: failure()
        run: |
          cargo metadata --no-deps --format-version 1 > /dev/null 2> metadata.log || true
          bash scripts/ci/annotate.sh metadata.log 0 10
          bash scripts/ci/annotate.sh fmt.log 0 10

  # Temporary formatting bot: the development sandbox for this branch has no Rust toolchain, so the
  # only way to obtain rustfmt output is to let CI apply it and push the result back. Removed once
  # the tree is formatted (see docs/security/PROVIDER_ENGINE_AUDIT.md).
  fmt-apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: apply rustfmt
        run: |
          set -o pipefail
          cargo fmt --all 2>&1 | tee fmt-apply.log
      - name: push formatting commit
        run: |
          set -o pipefail
          if git diff --quiet; then
            echo "already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply rustfmt"
          git push 2>&1 | tee push.log
      - name: annotate
        if: failure()
        run: |
          bash scripts/ci/annotate.sh fmt-apply.log 0 10
          bash scripts/ci/annotate.sh push.log 0 10

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check --workspace --all-targets
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --message-format=short 2>&1 | tee check.log
      - name: annotate
        if: failure()
        run: |
          for offset in 0 10 20 30 40; do
            bash scripts/ci/annotate.sh check.log "$offset" 10
          done

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --all-features --message-format=short -- -D warnings 2>&1 | tee clippy.log
      - name: annotate
        if: failure()
        run: |
          for offset in 0 10 20 30 40; do
            bash scripts/ci/annotate.sh clippy.log "$offset" 10
          done

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: unit + fixture tests (offline, deterministic)
        run: |
          set -o pipefail
          cargo test --workspace --all-features --message-format=short 2>&1 | tee test.log
      - name: annotate
        if: failure()
        run: |
          for offset in 0 10 20 30 40; do
            bash scripts/ci/annotate.sh test.log "$offset" 10
          done

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # No Cargo.lock is committed (see docs/security/PROVIDER_ENGINE_AUDIT.md), so it is generated.
      - run: cargo generate-lockfile
      - name: cargo audit
        run: |
          set -o pipefail
          cargo install cargo-audit --locked --quiet 2>&1 | tee install.log
          # Ignored advisories mirror deny.toml; the rationale lives in
          # docs/security/PROVIDER_ENGINE_AUDIT.md §7 (accepted third-party risk).
          cargo audit --ignore RUSTSEC-2024-0437 --ignore RUSTSEC-2026-0459 \
            --ignore RUSTSEC-2023-0071 2>&1 | tee audit.log
      - name: annotate
        if: failure()
        run: |
          bash scripts/ci/annotate.sh install.log 0 5
          bash scripts/ci/annotate.sh audit.log -1 40
          for offset in 0 10 20; do
            bash scripts/ci/annotate.sh audit.log "$offset" 10
          done

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo generate-lockfile
      - name: cargo deny
        run: |
          set -o pipefail
          cargo install cargo-deny --locked --quiet 2>&1 | tee install.log
          cargo deny check 2>&1 | tee deny.log
      - name: annotate
        if: failure()
        run: |
          bash scripts/ci/annotate.sh install.log 0 5
          grep -A6 'error\[rejected\]' deny.log | head -60 > deny-rejected.log || true
          bash scripts/ci/annotate.sh deny-rejected.log -1 40
          grep -B2 -A6 'error\[vulnerability\]' deny.log | head -40 > deny-vuln.log || true
          bash scripts/ci/annotate.sh deny-vuln.log -1 30
          bash scripts/ci/annotate.sh deny.log -1 40
          for offset in 0 10 20; do
            bash scripts/ci/annotate.sh deny.log "$offset" 10
          done

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: validate OpenAPI document
        run: npx --yes @redocly/cli@latest lint docs/api/openapi.yaml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: vydra:ci
