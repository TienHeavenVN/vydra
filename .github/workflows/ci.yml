name: ci

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: |
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee fmt.log
      - name: annotate
        if: always()
        run: |
          cargo metadata --no-deps --format-version 1 > /dev/null 2> metadata.log || true
          bash scripts/ci/annotate.sh metadata.log 0 10
          bash scripts/ci/annotate.sh fmt.log 0 10

  # Temporary formatting bot (Phase 4.3): the sandbox has no Rust toolchain, so the new probe example
  # can only be formatted by CI. Removed in the same pull request.
  fmt-apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: apply rustfmt
        run: |
          set -o pipefail
          cargo fmt --all 2>&1 | tee fmt-apply.log
      - name: push formatting commit
        run: |
          set -o pipefail
          if git diff --quiet; then
            echo "already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply rustfmt"
          git push 2>&1 | tee push.log
      - name: annotate
        if: always()
        run: |
          bash scripts/ci/annotate.sh fmt-apply.log 0 10
          bash scripts/ci/annotate.sh push.log 0 10

  # Temporary (Phase 4.3): `workflow_dispatch` cannot find `.github/workflows/probe.yml` until that
  # file exists on the default branch, so this job runs the same evidence probe when the head commit
  # message contains [probe]. Removed in the same pull request once the capture is committed; the
  # permanent manual entry point is `probe.yml`.
  probe:
    if: contains(github.event.head_commit.message, '[probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: run the evidence probe
        env:
          VYDRA_PROBE_OUT: probe-out
        run: |
          set -o pipefail
          cargo run --release -p vydra-providers --example probe_search 2>&1 | tee probe.log
      - name: summarise (annotations)
        if: always()
        run: |
          bash scripts/ci/annotate.sh probe.log -1 25
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-out
          path: |
            probe-out
            probe.log
          retention-days: 14
          if-no-files-found: warn
      # The development sandbox cannot reach the artifact storage host, so the evidence is also
      # published as a commit on this branch (redacted in-process by the probe, and gitignored so it
      # has to be forced in here). scripts/fixtures/import_probe.py reduces it into fixtures
      # afterwards; the raw capture is deleted in the follow-up commit.
      - name: publish the evidence
        if: always()
        run: |
          set -o pipefail
          if [ ! -d probe-out ]; then echo "no probe-out directory"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f probe-out probe.log
          if git diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
          git commit -m "chore: publish the Phase 4.3 probe output (redacted, temporary)"
          # `git fetch origin <branch>` sets FETCH_HEAD, not a remote-tracking ref, so rebase onto
          # FETCH_HEAD. (Rebasing onto origin/<branch> failed with "unknown revision".)
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase FETCH_HEAD || { git rebase --abort 2>/dev/null || true; exit 1; }
            if git push origin "HEAD:${GITHUB_REF_NAME}" 2>&1 | tee -a probe-push.log; then
              exit 0
            fi
            echo "push attempt ${attempt} rejected, retrying"
            sleep 5
          done
          exit 1
      - name: annotate the summary (fallback when publishing fails)
        if: always()
        run: |
          bash scripts/ci/annotate.sh probe-push.log -1 20
          python3 scripts/ci/summarise-probe.py probe-out/summary.json || true

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check --workspace --all-targets
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --message-format=short 2>&1 | tee check.log
      - name: annotate
        if: always()
        run: |
          grep -A6 '^error' check.log | head -50 > check-errors.log || true
          bash scripts/ci/annotate.sh check-errors.log -1 40
          for offset in 0 10 20 30 40; do
            bash scripts/ci/annotate.sh check.log "$offset" 10
          done

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: |
          set +e
          set -o pipefail
          cargo clippy --workspace --all-targets --all-features --message-format=short -- -D warnings 2>&1 | tee clippy.log
          status=$?
          bash scripts/ci/report.sh clippy.log
          exit $status

  test:
    runs-on: ubuntu-latest
    # One job per package. A single workspace-wide run took long enough to be killed by the
    # runner (exit 143 / "operation was canceled") before any diagnostic could be published,
    # and a hang in one package took every other package with it.
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        package:
          - "vydra-api-server"
          - "vydra-worker"
          - "vydra-api"
          - "vydra-auth"
          - "vydra-cache"
          - "vydra-common"
          - "vydra-config"
          - "vydra-database"
          - "vydra-domain"
          - "vydra-engines"
          - "vydra-errors"
          - "vydra-observability"
          - "vydra-provider-registry"
          - "vydra-providers"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test -p ${{ matrix.package }}
        run: |
          bash scripts/ci/test-package.sh "${{ matrix.package }}" test.log

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # No Cargo.lock is committed (see docs/security/PROVIDER_ENGINE_AUDIT.md), so it is generated.
      - run: cargo generate-lockfile
      - name: cargo audit
        run: |
          set -o pipefail
          cargo install cargo-audit --locked --quiet 2>&1 | tee install.log
          # Ignored advisories mirror deny.toml; the rationale lives in
          # docs/security/PROVIDER_ENGINE_AUDIT.md §7 (accepted third-party risk).
          cargo audit --ignore RUSTSEC-2024-0437 --ignore RUSTSEC-2026-0459 \
            --ignore RUSTSEC-2023-0071 2>&1 | tee audit.log
      - name: annotate
        if: always()
        run: |
          bash scripts/ci/annotate.sh install.log 0 5
          bash scripts/ci/annotate.sh audit.log -1 40
          for offset in 0 10 20; do
            bash scripts/ci/annotate.sh audit.log "$offset" 10
          done

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo generate-lockfile
      - name: cargo deny
        run: |
          set -o pipefail
          cargo install cargo-deny --locked --quiet 2>&1 | tee install.log
          cargo deny check 2>&1 | tee deny.log
      - name: annotate
        if: always()
        run: |
          bash scripts/ci/annotate.sh install.log 0 5
          grep -A6 'error\[rejected\]' deny.log | head -60 > deny-rejected.log || true
          bash scripts/ci/annotate.sh deny-rejected.log -1 40
          grep -B2 -A6 'error\[vulnerability\]' deny.log | head -40 > deny-vuln.log || true
          bash scripts/ci/annotate.sh deny-vuln.log -1 30
          bash scripts/ci/annotate.sh deny.log -1 40
          for offset in 0 10 20; do
            bash scripts/ci/annotate.sh deny.log "$offset" 10
          done

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: validate OpenAPI document
        run: npx --yes @redocly/cli@latest lint docs/api/openapi.yaml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: vydra:ci
