name: ci

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: |
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee fmt.log
      - name: annotate
        if: always()
        run: |
          cargo metadata --no-deps --format-version 1 > /dev/null 2> metadata.log || true
          bash scripts/ci/annotate.sh metadata.log 0 10
          bash scripts/ci/annotate.sh fmt.log 0 10

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check --workspace --all-targets
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --message-format=short 2>&1 | tee check.log
      - name: annotate
        if: always()
        run: |
          grep -A6 '^error' check.log | head -50 > check-errors.log || true
          bash scripts/ci/annotate.sh check-errors.log -1 40
          for offset in 0 10 20 30 40; do
            bash scripts/ci/annotate.sh check.log "$offset" 10
          done

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: |
          set +e
          set -o pipefail
          cargo clippy --workspace --all-targets --all-features --message-format=short -- -D warnings 2>&1 | tee clippy.log
          status=$?
          bash scripts/ci/report.sh clippy.log
          exit $status

  test:
    runs-on: ubuntu-latest
    # One job per package. A single workspace-wide run took long enough to be killed by the
    # runner (exit 143 / "operation was canceled") before any diagnostic could be published,
    # and a hang in one package took every other package with it.
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        package:
          - "vydra-api-server"
          - "vydra-worker"
          - "vydra-api"
          - "vydra-auth"
          - "vydra-cache"
          - "vydra-common"
          - "vydra-config"
          - "vydra-database"
          - "vydra-domain"
          - "vydra-engines"
          - "vydra-errors"
          - "vydra-observability"
          - "vydra-provider-registry"
          - "vydra-providers"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test -p ${{ matrix.package }}
        run: |
          bash scripts/ci/test-package.sh "${{ matrix.package }}" test.log

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # No Cargo.lock is committed (see docs/security/PROVIDER_ENGINE_AUDIT.md), so it is generated.
      - run: cargo generate-lockfile
      - name: cargo audit
        run: |
          set -o pipefail
          cargo install cargo-audit --locked --quiet 2>&1 | tee install.log
          # Ignored advisories mirror deny.toml; the rationale lives in
          # docs/security/PROVIDER_ENGINE_AUDIT.md §7 (accepted third-party risk).
          cargo audit --ignore RUSTSEC-2024-0437 --ignore RUSTSEC-2026-0459 \
            --ignore RUSTSEC-2023-0071 2>&1 | tee audit.log
      - name: annotate
        if: always()
        run: |
          bash scripts/ci/annotate.sh install.log 0 5
          bash scripts/ci/annotate.sh audit.log -1 40
          for offset in 0 10 20; do
            bash scripts/ci/annotate.sh audit.log "$offset" 10
          done

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo generate-lockfile
      - name: cargo deny
        run: |
          set -o pipefail
          cargo install cargo-deny --locked --quiet 2>&1 | tee install.log
          cargo deny check 2>&1 | tee deny.log
      - name: annotate
        if: always()
        run: |
          bash scripts/ci/annotate.sh install.log 0 5
          grep -A6 'error\[rejected\]' deny.log | head -60 > deny-rejected.log || true
          bash scripts/ci/annotate.sh deny-rejected.log -1 40
          grep -B2 -A6 'error\[vulnerability\]' deny.log | head -40 > deny-vuln.log || true
          bash scripts/ci/annotate.sh deny-vuln.log -1 30
          bash scripts/ci/annotate.sh deny.log -1 40
          for offset in 0 10 20; do
            bash scripts/ci/annotate.sh deny.log "$offset" 10
          done

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: validate OpenAPI document
        run: npx --yes @redocly/cli@latest lint docs/api/openapi.yaml

  # TEMPORARY (Phase 5A): apply rustfmt, publish clippy diagnostics on failure, and move the player
  # probe capture into the repository. Gated on a commit message token so ordinary pushes never run
  # it; removed before the phase is reported complete. The permanent entry point for the probe is
  # `.github/workflows/probe.yml` (`workflow_dispatch`, artifact only).
  player-probe:
    if: contains(github.event.head_commit.message, '[player-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: configure git
        run: |
          git config user.name "vydra-probe"
          git config user.email "probe@vydra.invalid"
      - name: apply rustfmt
        run: |
          cargo fmt --all
          git add -A
          git commit -m "style: apply rustfmt" || echo "already formatted"
      - name: clippy (diagnostics published when it fails)
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee clippy.log || true
          if grep -qE "^(error|warning)" clippy.log; then
            mkdir -p ci-diagnostics
            {
              echo "clippy for run ${GITHUB_RUN_ID}"
              grep -E "^(error|warning)" -A 8 clippy.log | head -400
            } > ci-diagnostics/clippy.log
            git add ci-diagnostics
            git commit -m "chore(diagnostics): clippy output for ${GITHUB_RUN_ID}" || true
          fi
      - name: run the player evidence probe
        env:
          VYDRA_PROBE_OUT: probe-out
          RUST_LOG: info
        run: cargo run --release -p vydra-providers --example probe_player 2>&1 | tee probe.log
      - name: archive the capture
        if: always()
        run: |
          bash scripts/ci/annotate.sh probe.log -1 25 || true
          python3 scripts/ci/summarise-probe.py probe-out/summary.json || true
          python3 scripts/fixtures/archive_probe.py probe-out "docs/research/data/player-probe-${GITHUB_RUN_ID}" \
            --kind player --capture-run "${GITHUB_RUN_ID}" | tee archive.log
      - name: publish on the branch
        if: always()
        run: |
          git add "docs/research/data/player-probe-${GITHUB_RUN_ID}" 2>/dev/null || true
          git commit -m "test(evidence): player probe capture ${GITHUB_RUN_ID}" || echo "nothing to publish"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-probe-out
          path: |
            probe-out
            probe.log
            clippy.log
            archive.log
          retention-days: 14
          if-no-files-found: warn

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: vydra:ci
