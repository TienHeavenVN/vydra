# Local development stack. Development defaults are intentionally permissive; every one of them is
# rejected by `Config::validate` in production (see docs/security/SECURITY.md).
services:
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      VYDRA__ENV: development
      VYDRA__AUTH__REQUIRED: "false"
      VYDRA__AUTH__BOOTSTRAP_KEY: "vydra_dev_localdevkey123"
      VYDRA__AUTH__CURSOR_SECRET: "dev-cursor-secret-not-for-production"
      VYDRA__CACHE__BACKEND: memory
      VYDRA__DATABASE__URL: postgres://vydra:vydra@postgres:5432/vydra
      VYDRA__OBSERVABILITY__LOG_FORMAT: pretty
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vydra
      POSTGRES_PASSWORD: vydra
      POSTGRES_DB: vydra
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vydra"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
