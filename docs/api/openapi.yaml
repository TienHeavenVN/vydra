          type: array
          description: Ordered smallest to largest.
          items: {$ref: '#/components/schemas/Thumbnail'}
        live_state: {type: string, enum: [not_live, live, upcoming, ended]}
        badges: {type: array, items: {type: string}}
    Count:
      type: object
      required: [value, precision]
      properties:
        value: {type: integer, minimum: 0}
        precision:
          type: string
          enum: [exact, approximate]
          description: |
            `approximate` is used only when the number came from abbreviated localized text ("1.2K
            views"); an exact upstream integer is never downgraded and an approximation is never
            presented as exact.
        raw: {type: string, description: The localized text the approximation came from.}
    Thumbnail:
      type: object
      required: [url]
      properties:
        url: {type: string}
        width: {type: integer}
        height: {type: integer}
    Availability:
      type: object
      required: [state]
      description: |
        Content existence and content availability are separate facts, so an unavailable video is a 200
        with an explicit state (never a 404). `unknown` means upstream stated no verdict; it is never
        cached and never reported as playable.
      properties:
        state: {type: string, enum: [available, upcoming, live, unavailable, unknown]}
        reason:
          type: string
          enum: [deleted, private, members_only, login_required, age_restricted, geo_restricted,
                 not_broadcasting, copyright_blocked, drm_protected, comments_disabled, other]
      example: {state: unavailable, reason: other}
    Publication:
      type: object
      required: [published_at, upstream_text, upstream_offset_seconds]
      description: |
        The instant is normalised to UTC (ADR-016); the upstream string and the publisher's offset are
        kept beside it so normalization loses nothing.
      properties:
        published_at: {type: string, format: date-time}
        upstream_text: {type: string, example: '2009-10-24T23:57:33-07:00'}
        upstream_offset_seconds: {type: integer, example: -25200}
        uploaded_at: {type: string, format: date-time}
        uploaded_text: {type: string}
